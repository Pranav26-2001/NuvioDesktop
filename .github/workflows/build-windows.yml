name: Build Windows EXE

on:
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create/update GitHub Release with Windows installer'
        required: false
        type: boolean
        default: true
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows EXE & MSI (x64)
    runs-on: windows-2022
    env:
      WEBVIEW2_VERSION: 1.0.4078.44

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Pull Windows native runtime binaries from LFS
        shell: bash
        run: |
          git lfs pull --include="composeApp/src/desktopMain/native/windows/runtime/**" --exclude=""
          runtime_path="composeApp/src/desktopMain/native/windows/runtime/libmpv-2.dll"
          if [[ ! -f "${runtime_path}" ]]; then
            echo "The bundled Windows libmpv runtime is missing." >&2
            exit 1
          fi

      - name: Ensure WiX Toolset in PATH
        shell: pwsh
        run: |
          $wixPaths = @(
            "C:\Program Files (x86)\WiX Toolset v3.14\bin",
            "C:\Program Files (x86)\WiX Toolset v3.11\bin"
          )
          foreach ($p in $wixPaths) {
            if (Test-Path $p) {
              Write-Host "Found WiX at $p"
              $p | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
              break
            }
          }

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Configure local.properties
        shell: pwsh
        run: |
          @"
          NUVIO_SUPABASE_URL=${{ secrets.NUVIO_SUPABASE_URL || 'https://api.nuvio.tv' }}
          NUVIO_SUPABASE_ANON_KEY=${{ secrets.NUVIO_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoiYW5vbiIsImlzcyI6InN1cGFiYXNlIiwiaWF0IjoxNzgxNTIxMzQ2LCJleHAiOjE5MzkyMDEzNDZ9.tmQaj682pwzehpqlgCDMnySOqiUvpgRbrE43T4VJpDI' }}
          TRAKT_CLIENT_ID=${{ secrets.TRAKT_CLIENT_ID || 'dummy' }}
          TRAKT_CLIENT_SECRET=${{ secrets.TRAKT_CLIENT_SECRET || 'dummy' }}
          MDBLIST_CLIENT_ID=${{ secrets.MDBLIST_CLIENT_ID || 'dummy' }}
          "@ | Out-File -FilePath local.properties -Encoding utf8

      - name: Install WebView2 SDK
        shell: pwsh
        run: |
          nuget install Microsoft.Web.WebView2 `
            -Version $env:WEBVIEW2_VERSION `
            -OutputDirectory "$env:RUNNER_TEMP\nuget" `
            -DirectDownload `
            -NonInteractive `
            -NoCache

          $webView2Root = Join-Path $env:RUNNER_TEMP "nuget\Microsoft.Web.WebView2.$env:WEBVIEW2_VERSION"
          $loaderLibrary = Join-Path $webView2Root "build\native\x64\WebView2Loader.dll.lib"
          if (-not (Test-Path $loaderLibrary)) {
            throw "WebView2Loader.dll.lib was not found at $loaderLibrary"
          }
          "WEBVIEW2_ROOT=$webView2Root" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build Windows EXE and MSI
        shell: pwsh
        run: |
          .\gradlew.bat `
            :composeApp:packageReleaseExe `
            :composeApp:packageReleaseMsi `
            "-Pnuvio.webview2.dir=$env:WEBVIEW2_ROOT" `
            "-Pcompose.desktop.packaging.checkJdkVendor=false" `
            --no-configuration-cache `
            --no-daemon `
            --stacktrace

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Nuvio-Windows-x64
          path: |
            composeApp/build/compose/release-exes/*.exe
            composeApp/build/compose/release-msis/*.msi
            composeApp/build/compose/binaries/*/exe/*.exe
            composeApp/build/compose/binaries/*/msi/*.msi
          if-no-files-found: error

      - name: Release Windows Binaries
        if: ${{ inputs.create_release != false || startsWith(github.ref, 'refs/tags/') }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name || 'latest' }}
          name: Nuvio Desktop DMG & Windows
          files: |
            composeApp/build/compose/release-exes/*.exe
            composeApp/build/compose/release-msis/*.msi
            composeApp/build/compose/binaries/*/exe/*.exe
            composeApp/build/compose/binaries/*/msi/*.msi
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
